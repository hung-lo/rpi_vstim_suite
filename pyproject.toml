[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-vstim"
version = "0.1.0"
description = "Raspberry Pi 5 visual stimulus and behavioral session framework"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
images = ["Pillow>=10"]

[project.scripts]
rpi-vstim = "rpi_vstim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
