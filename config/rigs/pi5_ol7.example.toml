[display]
backend = "kms"
# Ownership is intentionally unset until this future rig is audited.
# Choose "direct" or "lease" only after validating its display stack.
stimulus_connector = "HDMI-A-1"
preview_connector = "HDMI-A-2"
width_px = 1280
height_px = 720
refresh_hz = 60.0
require_exact_refresh = true
refresh_tolerance_hz = 0.05
pixel_format = "RGB565"
calibration_id = ""
physical_width_cm = 15.50
physical_height_cm = 8.72
eye_distance_cm = 16.0
