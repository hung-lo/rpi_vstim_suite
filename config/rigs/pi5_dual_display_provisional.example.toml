# Physically verified roles on the 2026-09-25 Pi.
# Replace connector names without changing protocol code if cables are swapped.
[display]
backend = "kms"
ownership = "lease"
stimulus_connector = "HDMI-A-2"
preview_connector = "HDMI-A-1"
width_px = 1024
height_px = 600
refresh_hz = 59.82
require_exact_refresh = true
refresh_tolerance_hz = 0.05
pixel_format = "RGB565"
calibration_id = ""
physical_width_cm = 15.40
physical_height_cm = 8.60
eye_distance_cm = 16.0
