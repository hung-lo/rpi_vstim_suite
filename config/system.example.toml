[paths]
output_root = "/mnt/hd"
cache_root = "/mnt/hd/vstim_cache"
asset_root = "/home/pi/stimulus_assets"
reward_state_root = "/mnt/hd/vstim_reward_assignments"

[display]
backend = "fake"
stimulus_connector = ""
preview_connector = ""
width_px = 1280
height_px = 720
refresh_hz = 60.0
require_exact_refresh = true
refresh_tolerance_hz = 0.05
pixel_format = "RGB565"
calibration_id = ""
physical_width_cm = 15.50
physical_height_cm = 8.72
eye_distance_cm = 16.0

[photodiode]
enabled = true
corner = "bottom_right"
size_px = 50
on_value = 255
off_value = 0

[gpio]
backend = "lgpio"
chip = 0
reward_pin_bcm = 19
suction_pin_bcm = 25
lick_pin_bcm = 26

[cameras]
enabled_by_default = false
record_to_session = true
verify_output_growth = true

[[cameras.devices]]
id = "camera_1"
role = "face"
required = false
backend = "auto"
device = ""

[[cameras.devices]]
id = "camera_2"
role = "behavior"
required = false
backend = "auto"
device = ""

[telemetry]
enabled = false
required = false
host = ""
port = 5055

[session]
require_interactive_gate = true
experimental = false
simulation = true

[protocol]
name = "natural-images"
version = "software-groundwork"
