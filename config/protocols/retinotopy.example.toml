[protocol]
name = "retinotopy"
version = "software-groundwork"
sweep_duration_s = 20.0
inter_sweep_gray_s = 5.0
initial_gray_s = 3.0
final_gray_s = 3.0
movement_frame_rate_hz = 15
bar_width_fraction = 0.10
enabled_directions = ["left_to_right", "top_to_bottom"]
repeats_per_direction = 1
sequence_order_mode = "fixed"
